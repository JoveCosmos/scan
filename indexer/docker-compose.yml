# Postgres for the indexer.
#
# Pinned to a specific minor version on purpose: an upgrade should be a
# deliberate act, not something a `docker compose pull` does silently.
#
# Bound to 127.0.0.1 only. Nothing about this database is reachable from the
# network; Scan and the worker both connect over loopback.

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: gata-indexer-db
    restart: unless-stopped
    # Host port is configurable so this cannot collide with any Postgres that
    # already exists on the box.
    ports:
      - "127.0.0.1:${INDEXER_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gata_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-indexer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Deterministic collation, so ordering does not shift under a locale change.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # A named volume, not a host bind mount. Docker owns the storage, which
      # avoids two real problems: the daemon may run in a confined mount
      # namespace where /srv is not writable, and a bind mount would need the
      # host directory chowned to the image's postgres uid. Backups come from
      # pg_dump, not from copying this directory.
      - pgdata:/var/lib/postgresql/data
      # No bind mount for the schema either. Snap-packaged Docker cannot see
      # /srv at all, and this box runs the snap for other things, so the schema
      # is applied by `npm run indexer:migrate` (piped over stdin) instead of
      # mounting sql/ into docker-entrypoint-initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indexer} -d ${POSTGRES_DB:-gata_indexer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The indexer is a background service; it must never crowd out the node or
    # Scan on a shared box. 4g, not 1g: at 1g the archive refill (backfill at
    # concurrency 16, the follower, Scan's reads and autoanalyze) was
    # OOM-killed twice, 2026-09-26 and 09-27. The box has 125 GB.
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  # Managed by Docker under its data root. `docker volume inspect
  # indexer_pgdata` shows where it lives on disk.
  pgdata:
