# /etc/nginx/sites-available/explorer.gatahub.zone
#
# Reverse proxy for the Next.js app on 127.0.0.1:3200.
# Start with this file as-is (HTTP only), then run certbot, which rewrites it
# to add the TLS server block and the redirect.

upstream scan_upstream {
    server 127.0.0.1:3200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name explorer.gatahub.zone;

    # Let certbot answer the ACME challenge before any redirect applies.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /var/log/nginx/scan.access.log;
    error_log  /var/log/nginx/scan.error.log;

    # Next already serves precompressed assets; gzip the HTML and JSON it does not.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml;

    # Immutable build output — safe to cache hard, the filenames are hashed.
    location /_next/static/ {
        proxy_pass http://scan_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://scan_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keepalive to the upstream; no websocket upgrade map needed because the
        # browser never opens one — chain data arrives over plain HTTP polling.
        proxy_set_header Connection        "";

        # Chain reads go out to public nodes, and a cold gno realm index can
        # take ~25s, so allow longer than nginx's 60s default.
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Streamed RSC responses must not be held back by the proxy buffer.
        proxy_buffering off;
    }

    # Scan pages are already no-store server-side; do not let a stale
    # intermediary cache head-of-chain data.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
